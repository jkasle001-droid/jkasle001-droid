// Lightweight Lucide-equivalent icon components (no external dependency).
// Each is a simple SVG wrapper accepting className, matching lucide's 24x24 viewBox + stroke style.
const { createElement: h } = React;

function makeIcon(paths) {
  return function Icon({ className = "", ...props }) {
    return h(
      "svg",
      {
        viewBox: "0 0 24 24",
        fill: "none",
        stroke: "currentColor",
        strokeWidth: 2,
        strokeLinecap: "round",
        strokeLinejoin: "round",
        className,
        ...props,
      },
      paths.map((d, i) => h("path", { key: i, d }))
    );
  };
}

function makeIconWithRect(rectProps, paths = []) {
  return function Icon({ className = "", ...props }) {
    return h(
      "svg",
      {
        viewBox: "0 0 24 24",
        fill: "none",
        stroke: "currentColor",
        strokeWidth: 2,
        strokeLinecap: "round",
        strokeLinejoin: "round",
        className,
        ...props,
      },
      [h("rect", { key: "rect", ...rectProps }), ...paths.map((d, i) => h("path", { key: i, d }))]
    );
  };
}

function SectionShell({ stepLabel, title, subtitle, children, defaultOpen = true, locked = false }) {
  const [open, setOpen] = useState(defaultOpen);
  return (
    <div className={`rounded-lg border ${locked ? "border-slate-200 bg-slate-50/60" : "border-slate-200 bg-white"} overflow-hidden`}>
      <button
        onClick={() => !locked && setOpen((o) => !o)}
        disabled={locked}
        className={`w-full flex items-center justify-between gap-4 px-5 py-4 text-left ${locked ? "cursor-not-allowed" : "hover:bg-slate-50"}`}
      >
        <div className="flex items-center gap-3 min-w-0">

          </span>
          <div className="min-w-0">
            <h2 className={`text-sm font-semibold tracking-wide ${locked ? "text-slate-400" : "text-slate-800"}`}>{title}</h2>
            {subtitle && <p className={`text-xs ${locked ? "text-slate-400" : "text-slate-500"} mt-0.5`}>{subtitle}</p>}
          </div>
        </div>
        {!locked && (open ? <ChevronDown className="h-4 w-4 text-slate-400 shrink-0" /> : <ChevronRight className="h-4 w-4 text-slate-400 shrink-0" />)}
      </button>
      {open && !locked && <div className="px-5 pb-6 pt-1 border-t border-slate-100">{children}</div>}
    </div>
  );
}

function FieldLabel({ children }) {
  return <label className="block text-xs font-medium text-slate-500 uppercase tracking-wide mb-1.5">{children}</label>;
}

function DropZone({ label, hint, file, onDrop, accent = false }) {
  const inputRef = useRef(null);
  const [dragging, setDragging] = useState(false);

  const handleFiles = (files) => {
    if (files && files[0]) onDrop(files[0].name);
  };

  return (
    <div
      onDragOver={(e) => { e.preventDefault(); setDragging(true); }}
      onDragLeave={() => setDragging(false)}
      onDrop={(e) => { e.preventDefault(); setDragging(false); handleFiles(e.dataTransfer.files); }}
      onClick={() => inputRef.current?.click()}
      className={`relative cursor-pointer rounded-lg border-2 border-dashed px-4 py-6 text-center transition-colors
        ${dragging ? "border-blue-600 bg-blue-50" : file ? "border-emerald-300 bg-emerald-50/40" : "border-slate-300 bg-slate-50 hover:border-slate-400"}`}
    >
      <input
        ref={inputRef}
        type="file"
        className="hidden"
        onChange={(e) => handleFiles(e.target.files)}
      />
      {file ? (
        <div className="flex flex-col items-center gap-1.5">
          <div className="flex h-9 w-9 items-center justify-center rounded-full bg-emerald-100">
            <Check className="h-4.5 w-4.5 text-emerald-600" />
          </div>
          <p className="text-sm font-medium text-slate-700">{file}</p>
          <p className="text-xs text-slate-400">Click to replace</p>
        </div>
      ) : (
        <div className="flex flex-col items-center gap-1.5">
          <div className={`flex h-9 w-9 items-center justify-center rounded-full ${accent ? "bg-blue-100" : "bg-slate-200"}`}>

          <p className="text-xs text-slate-400">{hint}</p>
        </div>
      )}
    </div>
  );
}

}

  );
}

                    <tr className="bg-slate-50 font-medium text-slate-700">
                      <td className="px-3 py-2" colSpan={3}>Subtotal (before OH+P)</td>
                      <td className="px-3 py-2 text-right tabular-nums">{currency(totalExtracted)}</td>
                    </tr>
                    <tr className="bg-blue-50 font-semibold text-blue-900">
                      <td className="px-3 py-2" colSpan={3}>Total w/ {ohp}% OH+P</td>
                      <td className="px-3 py-2 text-right tabular-nums">{currency(totalWithOhp)}</td>
                    </tr>
                  </tfoot>
                </table>
              </div>
            </div>

            <div>
              <FieldLabel>Reason for change</FieldLabel>
              <textarea
                value={reasonForChange}
                onChange={(e) => setReasonForChange(e.target.value)}
                rows={3}
                placeholder="e.g. Owner-directed relocation of VAV terminals per RFI #014 response, dated 5/29/26…"
                className="w-full rounded-md border border-slate-300 px-3 py-2.5 text-sm text-slate-700 resize-none focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-600"
              />
            </div>
          </div>
        )}
      </SectionShell>

      <SectionShell
        stepLabel="3"
        title="Review & Generation"
        subtitle="Preview the draft document, then submit for tracking"
        locked={!processed}
        defaultOpen={processed}
      >
        {processed && (
          <div className="space-y-5">
            <div className="rounded-md border border-slate-200 bg-slate-50 p-4">
              <div className="flex items-center justify-between text-sm">
                <span className="text-slate-500">Template</span>
                <span className="font-medium text-slate-700">{template.split(" – ")[1] || template}</span>
              </div>
              <div className="flex items-center justify-between text-sm mt-1.5">
                <span className="text-slate-500">Job / Sub #</span>
                <span className="font-medium text-slate-700">{jobName} · {subNumber}</span>
              </div>
              <div className="flex items-center justify-between text-sm mt-1.5">
                <span className="text-slate-500">Estimated CO value</span>
                <span className="font-semibold text-blue-900">{currency(totalWithOhp)}</span>
              </div>
            </div>

            <div className="flex flex-wrap items-center gap-3">
              <SecondaryButton onClick={handlePreview} disabled={generating} icon={generating ? Loader2 : FileText}>
                {generating ? "Generating Word Document…" : "Preview"}
              </SecondaryButton>

              {docReady && (
                <div className="flex items-center gap-2 rounded-md bg-emerald-50 px-3 py-2 text-sm text-emerald-700 ring-1 ring-emerald-200">
                  <Check className="h-4 w-4" />
                  <span>Draft ready —</span>
                  <a
                    href="#"
                    onClick={(e) => e.preventDefault()}
                    className="inline-flex items-center gap-1 font-medium underline hover:text-emerald-800"
                  >
                    <Download className="h-3.5 w-3.5" /> Draft_CO_v1.docx
                  </a>
                </div>
              )}

              <div className="ml-auto">
                <PrimaryButton onClick={handleSubmit} disabled={!docReady} loading={submitting} icon={Check}>
                  {submitting ? "Submitting…" : "Submit Change Order"}
                </PrimaryButton>
              </div>
            </div>
            {!docReady && (
              <p className="text-xs text-slate-400 text-right">Generate a preview before submitting</p>
            )}
          </div>
        )}
      </SectionShell>
    </div>
  );
}

// ---------------------------------------------------------------------------
// View 2: Tracking Dashboard
// ---------------------------------------------------------------------------

function StatusPill({ status }) {
  return (
    <span className={`inline-flex items-center rounded-full px-2.5 py-1 text-xs font-medium ring-1 ring-inset ${STATUS_STYLES[status]}`}>
      {status}
    </span>
  );
}

function AuditLogModal({ co, onClose }) {
  if (!co) return null;
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 px-4" onClick={onClose}>
      <div
        onClick={(e) => e.stopPropagation()}
        className="w-full max-w-md rounded-lg bg-white shadow-xl ring-1 ring-slate-200"
      >
        <div className="flex items-center justify-between border-b border-slate-100 px-5 py-4">
          <div className="flex items-center gap-2.5">
            <History className="h-4 w-4 text-blue-700" />
            <h3 className="text-sm font-semibold text-slate-800">Access log — {co.id}</h3>
          </div>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600">
            <X className="h-4 w-4" />
          </button>
        </div>
        <div className="px-5 py-4">
          <p className="text-xs text-slate-400 mb-3">{co.jobName}</p>
          <ol className="space-y-4">
            {co.log.map((entry, i) => (
              <li key={i} className="relative flex gap-3 pl-1">
                <div className="flex flex-col items-center">
                  <span className="mt-1 h-2 w-2 rounded-full bg-blue-700" />
                  {i < co.log.length - 1 && <span className="w-px flex-1 bg-slate-200" />}
                </div>
                <div className="pb-1">
                  <p className="text-sm text-slate-700">
                    <span className="font-medium">{entry.who}</span> — {entry.action}
                  </p>
                  <p className="flex items-center gap-1 text-xs text-slate-400 mt-0.5">
                    <Clock className="h-3 w-3" /> {entry.time}
                  </p>
                </div>
              </li>
            ))}
          </ol>
        </div>
        <div className="border-t border-slate-100 px-5 py-3 flex justify-end">
          <button onClick={onClose} className="text-sm font-medium text-slate-500 hover:text-slate-700">
            Close
          </button>
        </div>
      </div>
    </div>
  );
}

function ReassignModal({ co, onClose, onReassign }) {
  const [value, setValue] = useState(co?.pmpe || "");
  if (!co) return null;
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 px-4" onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} className="w-full max-w-sm rounded-lg bg-white shadow-xl ring-1 ring-slate-200">
        <div className="flex items-center justify-between border-b border-slate-100 px-5 py-4">
          <h3 className="text-sm font-semibold text-slate-800">Reassign {co.id}</h3>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600">
            <X className="h-4 w-4" />
          </button>
        </div>
        <div className="px-5 py-4">
          <FieldLabel>New PM / PE</FieldLabel>
          <input
            value={value}
            onChange={(e) => setValue(e.target.value)}
            className="w-full rounded-md border border-slate-300 px-3 py-2 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-600"
          />
        </div>
        <div className="border-t border-slate-100 px-5 py-3 flex justify-end gap-2">
          <button onClick={onClose} className="text-sm font-medium text-slate-500 hover:text-slate-700 px-2">
            Cancel
          </button>
          <PrimaryButton onClick={() => { onReassign(co.id, value); onClose(); }}>Save</PrimaryButton>
        </div>
      </div>
    </div>
  );
}

function ActionsMenu({ co, onView, onReassign }) {
  const [open, setOpen] = useState(false);
  return (
    <div className="relative">
      <button
        onClick={() => setOpen((o) => !o)}
        className="flex h-8 w-8 items-center justify-center rounded-md text-slate-400 hover:bg-slate-100 hover:text-slate-600"
      >
        <MoreVertical className="h-4 w-4" />
      </button>
      {open && (
        <>
          <div className="fixed inset-0 z-10" onClick={() => setOpen(false)} />
          <div className="absolute right-0 z-20 mt-1 w-48 rounded-md border border-slate-200 bg-white py-1 shadow-lg">
            <button
              onClick={() => { onView(co); setOpen(false); }}
              className="flex w-full items-center gap-2.5 px-3 py-2 text-sm text-slate-600 hover:bg-slate-50"
            >
              <Eye className="h-3.5 w-3.5" /> View access log
            </button>
            <button
              onClick={() => { onReassign(co); setOpen(false); }}
              className="flex w-full items-center gap-2.5 px-3 py-2 text-sm text-slate-600 hover:bg-slate-50"
            >
              <Repeat className="h-3.5 w-3.5" /> Reassign
            </button>
          </div>
        </>
      )}
    </div>
  );
}

function TrackingDashboard({ cos, setCos, highlightId, showToast }) {
  const [jobFilter, setJobFilter] = useState("");
  const [subFilter, setSubFilter] = useState("");
  const [pmpeFilter, setPmpeFilter] = useState("");
  const [logModalCO, setLogModalCO] = useState(null);
  const [reassignCO, setReassignCO] = useState(null);
  const [exporting, setExporting] = useState(false);
  const [page, setPage] = useState(1);
  const pageSize = 10;

  const filtered = cos.filter((co) => {
    return (
      co.jobName.toLowerCase().includes(jobFilter.toLowerCase()) &&
      co.subNumber.toLowerCase().includes(subFilter.toLowerCase()) &&
      co.pmpe.toLowerCase().includes(pmpeFilter.toLowerCase())
    );
  });

  const totalValue = filtered.reduce((s, c) => s + c.value, 0);

  const handleExport = () => {
    setExporting(true);
    setTimeout(() => {
      setExporting(false);
      showToast("Exported with Cost Codes (Hours/$).");
    }, 1300);
  };

  const handleReassign = (id, newPmpe) => {
    setCos((prev) =>
      prev.map((c) =>
        c.id === id
          ? {
              ...c,
              pmpe: newPmpe,
              log: [...c.log, { who: "System", action: `Reassigned to ${newPmpe}`, time: "Just now" }],
            }
          : c
      )
    );
    showToast(`${id} reassigned to ${newPmpe}.`);
  };

  return (
    <div className="max-w-6xl mx-auto space-y-5">
      <div className="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4">
        <div>
          <h2 className="text-lg font-semibold text-slate-800">Tracking Dashboard</h2>
          <p className="text-sm text-slate-500 mt-0.5">{filtered.length} change orders · {currency(totalValue)} total value</p>
        </div>
        <SecondaryButton onClick={handleExport} icon={exporting ? Loader2 : Download} disabled={exporting}>
          {exporting ? "Exporting…" : "Export to Sage (.csv)"}
        </SecondaryButton>
      </div>

      <div className="rounded-lg border border-slate-200 bg-white p-4">
        <div className="flex items-center gap-2 mb-3 text-xs font-medium uppercase tracking-wide text-slate-400">
          <Filter className="h-3.5 w-3.5" /> Filter
        </div>
        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div className="relative">
            <Hash className="absolute left-3 top-2.5 h-3.5 w-3.5 text-slate-400" />
            <input
              value={subFilter}
              onChange={(e) => { setSubFilter(e.target.value); setPage(1); }}
              placeholder="Subcontractor #"
              className="w-full rounded-md border border-slate-300 pl-8 pr-3 py-2 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-600"
            />
          </div>
          <div className="relative">
            <Building2 className="absolute left-3 top-2.5 h-3.5 w-3.5 text-slate-400" />
            <input
              value={jobFilter}
              onChange={(e) => { setJobFilter(e.target.value); setPage(1); }}
              placeholder="Job name"
              className="w-full rounded-md border border-slate-300 pl-8 pr-3 py-2 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-600"
            />
          </div>
          <div className="relative">
            <User className="absolute left-3 top-2.5 h-3.5 w-3.5 text-slate-400" />
            <input
              value={pmpeFilter}
              onChange={(e) => { setPmpeFilter(e.target.value); setPage(1); }}
              placeholder="PM / PE name"
              className="w-full rounded-md border border-slate-300 pl-8 pr-3 py-2 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-600"
            />
          </div>
        </div>
      </div>

      <div className="rounded-lg border border-slate-200 bg-white overflow-hidden">
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr className="bg-slate-50 text-left text-xs uppercase tracking-wide text-slate-400 border-b border-slate-200">
                <th className="px-4 py-3 font-medium">CO #</th>
                <th className="px-4 py-3 font-medium">Job name</th>
                <th className="px-4 py-3 font-medium">Sub #</th>
                <th className="px-4 py-3 font-medium">PM / PE</th>
                <th className="px-4 py-3 font-medium">Status</th>
                <th className="px-4 py-3 font-medium text-right">Total value</th>
                <th className="px-4 py-3 font-medium text-right">Actions</th>
              </tr>
            </thead>
            <tbody className="divide-y divide-slate-100">
              {filtered.slice((page - 1) * pageSize, page * pageSize).map((co) => (
                <tr
                  key={co.id}
                  className={`text-slate-600 transition-colors ${co.id === highlightId ? "bg-blue-50" : "hover:bg-slate-50/80"}`}
                >
                  <td className="px-4 py-3 font-medium text-slate-700">{co.id}</td>
                  <td className="px-4 py-3">{co.jobName}</td>
                  <td className="px-4 py-3 text-slate-500">{co.subNumber}</td>
                  <td className="px-4 py-3">{co.pmpe}</td>
                  <td className="px-4 py-3"><StatusPill status={co.status} /></td>
                  <td className="px-4 py-3 text-right tabular-nums">{currency(co.value)}</td>
                  <td className="px-4 py-3 text-right">
                    <div className="flex justify-end">
                      <ActionsMenu co={co} onView={setLogModalCO} onReassign={setReassignCO} />
                    </div>
                  </td>
                </tr>
              ))}
              {filtered.length === 0 && (
                <tr>
                  <td colSpan={7} className="px-4 py-10 text-center text-sm text-slate-400">
                    No change orders match these filters.
                  </td>
                </tr>
              )}
            </tbody>
          </table>
        </div>
        {filtered.length > pageSize && (
          <div className="flex items-center justify-between border-t border-slate-100 px-4 py-3 text-sm text-slate-500">
            <span>Page {page} of {Math.ceil(filtered.length / pageSize)}</span>
            <div className="flex gap-2">
              <button disabled={page === 1} onClick={() => setPage((p) => p - 1)} className="rounded-md p-1.5 hover:bg-slate-100 disabled:opacity-30">
                <ChevronLeft className="h-4 w-4" />
              </button>
              <button
                disabled={page === Math.ceil(filtered.length / pageSize)}
                onClick={() => setPage((p) => p + 1)}
                className="rounded-md p-1.5 hover:bg-slate-100 disabled:opacity-30"
              >
                <ChevronRight className="h-4 w-4" />
              </button>
            </div>
          </div>
        )}
      </div>

      <AuditLogModal co={logModalCO} onClose={() => setLogModalCO(null)} />
      <ReassignModal co={reassignCO} onClose={() => setReassignCO(null)} onReassign={handleReassign} />
    </div>
  );
}

// ---------------------------------------------------------------------------
// Root app
// ---------------------------------------------------------------------------

function App() {
  const [view, setView] = useState("new"); // "new" | "tracking"
  const [cos, setCos] = useState(seedCOs);
  const [highlightId, setHighlightId] = useState(null);
  const [toast, setToast] = useState(null);
  const [workflowKey, setWorkflowKey] = useState(0); // forces NewCOWorkflow reset

  const showToast = (message) => {
    setToast(message);
    setTimeout(() => setToast(null), 3200);
  };

  const handleSubmitCO = ({ jobName, subNumber, pmpe, value }) => {
    const nextNum = Math.max(...cos.map((c) => parseInt(c.id.split("-")[1], 10))) + 1;
    const id = `CO-${String(nextNum).padStart(4, "0")}`;
    const newCO = {
      id,
      jobName,
      subNumber,
      pmpe,
      status: "Pending",
      value,
      createdAt: new Date().toISOString().slice(0, 10),
      log: [{ who: `PE – ${pmpe}`, action: "Created & submitted draft", time: "Just now" }],
    };
    setCos((prev) => [newCO, ...prev]);
    setHighlightId(id);
    setView("tracking");
    setWorkflowKey((k) => k + 1);
    showToast(`${id} submitted and added to the tracking dashboard.`);
    setTimeout(() => setHighlightId(null), 4000);
  };

  return (
    <div className="min-h-screen bg-slate-50 text-slate-700">
      <style>{`
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .tabular-nums { font-variant-numeric: tabular-nums; }
      `}</style>

      {/* Top bar */}
      <header className="sticky top-0 z-30 border-b border-slate-200 bg-white/90 backdrop-blur">
        <div className="max-w-6xl mx-auto px-4 sm:px-6 flex items-center justify-between h-16">
          <div className="flex items-center gap-2.5">
            <div className="flex h-8 w-8 items-center justify-center rounded-md bg-blue-700 text-white">
              <ClipboardList className="h-4.5 w-4.5" />
            </div>
            <div className="leading-tight">
              <p className="text-sm font-semibold text-slate-800">CO Automation & Tracking</p>
              <p className="text-[11px] text-slate-400">MEP Project Management Workspace</p>
            </div>
          </div>

          <nav className="flex items-center gap-1 rounded-md bg-slate-100 p-1">
            <button
              onClick={() => setView("new")}
              className={`flex items-center gap-1.5 rounded-md px-3 py-1.5 text-sm font-medium transition-colors ${
                view === "new" ? "bg-white text-blue-700 shadow-sm" : "text-slate-500 hover:text-slate-700"
              }`}
            >
              <Sparkles className="h-3.5 w-3.5" /> New Change Order
            </button>
            <button
              onClick={() => setView("tracking")}
              className={`flex items-center gap-1.5 rounded-md px-3 py-1.5 text-sm font-medium transition-colors ${
                view === "tracking" ? "bg-white text-blue-700 shadow-sm" : "text-slate-500 hover:text-slate-700"
              }`}
            >
              <LayoutDashboard className="h-3.5 w-3.5" /> Tracking Dashboard
            </button>
          </nav>
        </div>
      </header>

      <main className="px-4 sm:px-6 py-8">
        {view === "new" ? (
          <NewCOWorkflow key={workflowKey} onSubmitCO={handleSubmitCO} />
        ) : (
          <TrackingDashboard cos={cos} setCos={setCos} highlightId={highlightId} showToast={showToast} />
        )}
      </main>

      {toast && <Toast message={toast} onClose={() => setToast(null)} />}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
